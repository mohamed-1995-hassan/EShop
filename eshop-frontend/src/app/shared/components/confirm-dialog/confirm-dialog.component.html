@if (isOpen()) {
  <div class="fixed inset-0 z-50 overflow-y-auto">
    <!-- Backdrop -->
    <div 
      class="fixed inset-0 bg-black/50 transition-opacity"
      (click)="cancel()"
    ></div>

    <!-- Dialog -->
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="relative bg-white rounded-lg shadow-xl max-w-md w-full transform transition-all">
        <!-- Icon -->
        <div class="pt-6 px-6">
          <div 
            class="mx-auto flex h-12 w-12 items-center justify-center rounded-full"
            [class.bg-blue-100]="data()?.type === 'info'"
            [class.bg-yellow-100]="data()?.type === 'warning'"
            [class.bg-red-100]="data()?.type === 'danger'"
          >
            @switch (data()?.type) {
              @case ('info') {
                <svg class="h-6 w-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              }
              @case ('warning') {
                <svg class="h-6 w-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
              }
              @case ('danger') {
                <svg class="h-6 w-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
              }
              @default {
                <svg class="h-6 w-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              }
            }
          </div>
        </div>

        <!-- Content -->
        <div class="p-6 text-center">
          <h3 class="text-lg font-semibold text-gray-900 mb-2">
            {{ data()?.title }}
          </h3>
          <p class="text-sm text-gray-500">
            {{ data()?.message }}
          </p>
        </div>

        <!-- Actions -->
        <div class="px-6 pb-6 flex flex-col sm:flex-row-reverse gap-3">
          <button
            (click)="confirm()"
            class="w-full sm:w-auto px-4 py-2 rounded-lg font-medium text-white transition-colors"
            [class.bg-blue-600]="data()?.type === 'info'"
            [class.hover:bg-blue-700]="data()?.type === 'info'"
            [class.bg-yellow-600]="data()?.type === 'warning'"
            [class.hover:bg-yellow-700]="data()?.type === 'warning'"
            [class.bg-red-600]="data()?.type === 'danger'"
            [class.hover:bg-red-700]="data()?.type === 'danger'"
          >
            {{ data()?.confirmText || 'Confirm' }}
          </button>
          <button
            (click)="cancel()"
            class="w-full sm:w-auto px-4 py-2 rounded-lg font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 transition-colors"
          >
            {{ data()?.cancelText || 'Cancel' }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
