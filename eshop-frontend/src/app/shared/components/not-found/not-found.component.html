<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="max-w-lg w-full text-center">
    <div class="mb-8">
      <h1 class="text-9xl font-bold text-primary-600">404</h1>
      <div class="w-full h-1 bg-gradient-to-r from-transparent via-primary-600 to-transparent my-4"></div>
    </div>
    
    <h2 class="text-2xl font-semibold text-gray-900 mb-2">Page Not Found</h2>
    <p class="text-gray-600 mb-8">
      Sorry, the page you're looking for doesn't exist or has been moved.
    </p>
    
    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
      <a 
        routerLink="/"
        class="w-full sm:w-auto px-6 py-3 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 transition-colors"
      >
        Go to Homepage
      </a>
      <button 
        (click)="goBack()"
        class="w-full sm:w-auto px-6 py-3 border border-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-50 transition-colors"
      >
        Go Back
      </button>
    </div>
    
    <div class="mt-12">
      <p class="text-sm text-gray-500 mb-4">You might want to check out:</p>
      <div class="flex flex-wrap justify-center gap-4">
        <a routerLink="/products" class="text-primary-600 hover:text-primary-700 text-sm">Products</a>
        <a routerLink="/categories" class="text-primary-600 hover:text-primary-700 text-sm">Categories</a>
        <a routerLink="/account/support" class="text-primary-600 hover:text-primary-700 text-sm">Contact Support</a>
      </div>
    </div>
  </div>
</div>
