<div class="fixed top-4 right-4 z-50 space-y-3 max-w-sm w-full">
  @for (toast of toasts(); track toast.id) {
    <div 
      class="bg-white rounded-lg shadow-lg border p-4 transform transition-all duration-300 animate-slide-in"
      [class.border-green-200]="toast.type === 'success'"
      [class.border-red-200]="toast.type === 'error'"
      [class.border-yellow-200]="toast.type === 'warning'"
      [class.border-blue-200]="toast.type === 'info'"
    >
      <div class="flex items-start">
        <!-- Icon -->
        <div class="flex-shrink-0">
          @switch (toast.type) {
            @case ('success') {
              <div class="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center">
                <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
              </div>
            }
            @case ('error') {
              <div class="w-8 h-8 bg-red-100 rounded-full flex items-center justify-center">
                <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </div>
            }
            @case ('warning') {
              <div class="w-8 h-8 bg-yellow-100 rounded-full flex items-center justify-center">
                <svg class="w-5 h-5 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
              </div>
            }
            @case ('info') {
              <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              </div>
            }
          }
        </div>

        <!-- Content -->
        <div class="ml-3 flex-1">
          <p class="text-sm font-medium text-gray-900">{{ toast.title }}</p>
          @if (toast.message) {
            <p class="mt-1 text-sm text-gray-500">{{ toast.message }}</p>
          }
        </div>

        <!-- Close Button -->
        <button 
          (click)="remove(toast.id)"
          class="ml-4 text-gray-400 hover:text-gray-600 transition-colors"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
  }
</div>
