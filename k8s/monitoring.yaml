# ServiceMonitor for Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: eshop-api-monitor
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: eshop-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - default
      - production
      - staging

---
# PrometheusRule for Alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: eshop-api-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: eshop-api
      rules:
        # High error rate
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{job="eshop-api",status=~"5.."}[5m])) 
            / sum(rate(http_requests_total{job="eshop-api"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate detected"
            description: "Error rate is above 5% for the last 5 minutes"
        
        # High latency
        - alert: HighLatency
          expr: |
            histogram_quantile(0.95, 
              sum(rate(http_request_duration_seconds_bucket{job="eshop-api"}[5m])) by (le)
            ) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency detected"
            description: "95th percentile latency is above 1 second"
        
        # Pod not ready
        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{pod=~"eshop-api.*",condition="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod is not ready"
            description: "Pod {{ $labels.pod }} has been not ready for 5 minutes"
        
        # High memory usage
        - alert: HighMemoryUsage
          expr: |
            container_memory_usage_bytes{container="eshop-api"} 
            / container_spec_memory_limit_bytes{container="eshop-api"} > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage"
            description: "Memory usage is above 90%"
        
        # High CPU usage
        - alert: HighCpuUsage
          expr: |
            rate(container_cpu_usage_seconds_total{container="eshop-api"}[5m]) 
            / container_spec_cpu_quota{container="eshop-api"} * 100000 > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage"
            description: "CPU usage is above 90%"

---
# Grafana Dashboard ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: eshop-grafana-dashboard
  labels:
    grafana_dashboard: "1"
data:
  eshop-dashboard.json: |
    {
      "dashboard": {
        "title": "EShop API Dashboard",
        "uid": "eshop-api",
        "panels": [
          {
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{job=\"eshop-api\"}[5m])) by (method, route)",
                "legendFormat": "{{method}} {{route}}"
              }
            ]
          },
          {
            "title": "Error Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{job=\"eshop-api\",status=~\"5..\"}[5m]))",
                "legendFormat": "5xx errors"
              }
            ]
          },
          {
            "title": "Response Time (p95)",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"eshop-api\"}[5m])) by (le, route))",
                "legendFormat": "{{route}}"
              }
            ]
          },
          {
            "title": "Active Connections",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(http_connections_active{job=\"eshop-api\"})"
              }
            ]
          }
        ]
      }
    }
